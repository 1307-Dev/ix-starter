# GitLab Pages deployment for ix-starter
# Serves three apps at:  /react/  |  /angular/  |  /vue/
# Root redirects to /react/
# Site root: https://ix-starter-04d0a9.code.siemens.io/
#
# NOTE: If your runners require specific tags, add to each job:
#   tags: [your-runner-tag]
#
# NOTE: If node:22-alpine is not available on your runner, replace the image with
#   your internal registry equivalent

image: node:22-alpine

stages:
  - build
  - deploy

# ── Shared setup ─────────────────────────────────────────────────────────────
.setup: &setup
  before_script:
    - npm config set registry https://captain.rtf.siemens.net/artifactory/api/npm/npm-remote/
    - npm install -g pnpm@9.15.0

# ── Build jobs (run in parallel) ─────────────────────────────────────────────

build-react:
  stage: build
  <<: *setup
  script:
    - export PAGES_BASE=""
    - cd react-starter
    - pnpm install --frozen-lockfile
    - BASE_PATH="${PAGES_BASE}/react/" pnpm build
  artifacts:
    paths:
      - react-starter/dist/

build-vue:
  stage: build
  <<: *setup
  script:
    - export PAGES_BASE=""
    - cd vue-starter
    - pnpm install --frozen-lockfile
    - BASE_PATH="${PAGES_BASE}/vue/" pnpm build
  artifacts:
    paths:
      - vue-starter/dist/

build-angular:
  stage: build
  <<: *setup
  script:
    - export PAGES_BASE=""
    - cd angular-starter
    - pnpm install --frozen-lockfile
    - pnpm exec ng build --base-href "${PAGES_BASE}/angular/"
  artifacts:
    paths:
      - angular-starter/dist/

# ── Deploy to GitLab Pages ────────────────────────────────────────────────────

pages:
  stage: deploy
  dependencies:
    - build-react
    - build-vue
    - build-angular
  script:
    - export PAGES_BASE=""
    - mkdir -p public/react public/vue public/angular

    # Copy each app's build output into its subpath
    - cp -r react-starter/dist/* public/react/
    - cp -r vue-starter/dist/* public/vue/
    - cp -r angular-starter/dist/browser/* public/angular/

    # SPA fallback: GitLab Pages serves 404.html for unknown routes,
    # which lets the client-side router take over
    - cp public/react/index.html public/react/404.html
    - cp public/vue/index.html public/vue/404.html
    - cp public/angular/index.html public/angular/404.html

    # Root redirect → React app
    - printf '<html><head><meta http-equiv="refresh" content="0;url=%s/react/"></head></html>\n' "$PAGES_BASE" > public/index.html

    # Root 404.html — GitLab Pages only reliably uses root-level 404.html.
    # Detects which SPA was targeted, stores path in sessionStorage, redirects
    # to the app root. Each app's index.html restores the path before the
    # router initialises (see the inline script in each index.html).
    - |
      cat > public/404.html <<'HTMLEOF'
      <!DOCTYPE html><html><head><script>
        var p=location.pathname,b='/react/';
        if(p.startsWith('/angular/'))b='/angular/';
        else if(p.startsWith('/vue/'))b='/vue/';
        sessionStorage.setItem('ix-redirect',p+location.search+location.hash);
        location.replace(b);
      </script></head></html>
      HTMLEOF

  artifacts:
    paths:
      - public
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
